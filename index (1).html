<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Overview</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--text:#1f1f1d;--mute:#6b6b66;--line:#e2e2dc;--acc:#2f6f5e;--bad:#b3392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222221;--text:#ececE8;--mute:#9a9a94;--line:#3a3a37;--acc:#6fc2aa;--bad:#ef8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#222221;--text:#ececE8;--mute:#9a9a94;--line:#3a3a37;--acc:#6fc2aa;--bad:#ef8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:14px;margin:20px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:500px}
th{font-size:12px;color:var(--mute);text-align:left;font-weight:500;padding:4px}
td{padding:3px}
input,select{width:100%;box-sizing:border-box;font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px}
input.n{text-align:right}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button.add{margin-top:8px;color:var(--acc);border-color:var(--acc)}
button.x{color:var(--bad);padding:6px 9px}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.sum div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.big{font-weight:600;font-size:17px;border-top:1px solid var(--line);padding-top:6px}
.neg{color:var(--bad)}.pos{color:var(--acc)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.filters select,.filters input{width:auto;flex:1;min-width:120px}.filters span{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<h1>Pazora Expense Overview (৳)</h1>
<div id="st" style="font-size:12px;color:var(--mute);margin:-6px 0 8px">Loading…</div>

<h2>Person-wise expense</h2>
<div class="card"><div class="sum" id="sum"></div></div>

<div id="cb" hidden></div>

<h2>Expenses</h2>
<div class="filters"><select id="fp" onchange="fp=this.value;render()"></select><span>From</span><input type="date" id="f1" onchange="f1=this.value;render()"><span>To</span><input type="date" id="f2" onchange="f2=this.value;render()"><button onclick="clearF()">Clear</button></div>
<div class="card">
<table><thead><tr><th>Item</th><th style="width:128px">Date</th><th style="width:78px">Amount</th><th style="width:84px">Paid by</th><th style="width:34px"></th></tr></thead><tbody id="eb"></tbody></table>
<button class="add" onclick="addE()">+ Add expense</button>
</div>

<script>
var contrib=[["Riz", 840], ["Saba", 1000], ["Sadid", 5555]];
var exp=[["Day 1 – Bhara", 195, "Riz"], ["Day 1 – Craft items (Saba)", 1000, "Saba"], ["Day 1 – Craft items (Sadid)", 750, "Sadid"], ["Day 2 – Bhara", 200, "Sadid"], ["Day 2 – Frame", 300, "Sadid"], ["Day 3 – Cutting mat", 800, "Sadid"], ["Day 3 – Geometry tool", 50, "Sadid"], ["SIM", 300, "Sadid"], ["Other (no record)", 330, "Fund"], ["Domain", 200, "Riz"], ["Printing (Riz part)", 200, "Riz"], ["Printing (rest)", 500, "Sadid"], ["Saturday bhara (Riz)", 80, "Riz"], ["Saturday bhara (rest)", 310, "Sadid"], ["Bubble wrap", 400, "Riz"], ["Pizza box advance", 500, "Riz"], ["Ad Run meta", 600, "Sadid", "2026-11-15"], ["Bhara", 200, "Sadid", "2026-11-15"], ["Paper", 150, "Sadid", "2026-11-15"], ["Cutting", 20, "Sadid", "2026-11-15"], ["First print", 510, "Sadid", "2026-11-15"], ["2nd print", 400, "Sadid", "2026-11-15"], ["Printing", 430, "Sadid", "2026-11-15"], ["Vinyl", 3460, "Sadid", "2026-11-15"], ["Glue", 250, "Sadid", "2026-11-17"], ["Bhara", 50, "Sadid", "2026-11-17"], ["Spray paint", 200, "Sadid", "2026-11-17"]];
var fp="",f1="",f2="";
function matchD(e){return (!f1||(e[3]&&e[3]>=f1))&&(!f2||(e[3]&&e[3]<=f2))}
function match(e){return (!fp||e[2]===fp)&&(!f1||(e[3]&&e[3]>=f1))&&(!f2||(e[3]&&e[3]<=f2))}
function clearF(){fp=f1=f2="";document.getElementById("f1").value="";document.getElementById("f2").value="";render()}
function fmt(n){return "৳"+Number(n).toLocaleString("en-US")}
function sumBy(f){return exp.filter(f).reduce(function(a,e){return a+e[1]},0)}
function render(){
var cb=document.getElementById("cb"),eb=document.getElementById("eb");
cb.innerHTML="";eb.innerHTML="";
contrib.forEach(function(c,i){
var tr=document.createElement("tr");
tr.innerHTML='<td><input value="'+c[0]+'"></td><td><input class="n" type="number" inputmode="numeric" value="'+c[1]+'"></td><td><button class="x">✕</button></td>';
var ins=tr.querySelectorAll("input");
ins[0].onchange=function(){c[0]=ins[0].value;render()};
ins[1].onchange=function(){c[1]=+ins[1].value||0;sumup()};
tr.querySelector("button").onclick=function(){contrib.splice(i,1);render()};
cb.appendChild(tr)});
var payers=["Fund"].concat(contrib.map(function(c){return c[0]}));
var fpEl=document.getElementById("fp"),allP=payers.slice();
exp.forEach(function(e){if(allP.indexOf(e[2])<0)allP.push(e[2])});
fpEl.innerHTML='<option value="">All persons</option>'+allP.map(function(p){return '<option'+(p===fp?' selected':'')+'>'+p+'</option>'}).join("");
exp.forEach(function(e,i){
if(!match(e))return;
var tr=document.createElement("tr");
var opts=payers.slice();if(opts.indexOf(e[2])<0)opts.push(e[2]);
tr.innerHTML='<td><input data-i="'+i+'" data-f="0" value="'+e[0]+'"></td><td><input data-i="'+i+'" data-f="1" type="date" value="'+(e[3]||'')+'"></td><td><input data-i="'+i+'" data-f="2" class="n" type="number" inputmode="numeric" value="'+e[1]+'"></td><td><select data-i="'+i+'" data-f="3">'+opts.map(function(p){return '<option'+(p===e[2]?' selected':'')+'>'+p+'</option>'}).join("")+'</select></td><td><button class="x">✕</button></td>';
var ins=tr.querySelectorAll("input"),sel=tr.querySelector("select");
tr.querySelector("button").onclick=function(){exp.splice(i,1);render()};
eb.appendChild(tr)});
sumup()}
function sumup(){
var names={};
exp.forEach(function(e){if(matchD(e))names[e[2]]=(names[e[2]]||0)+e[1]});
var h='';
Object.keys(names).forEach(function(k){h+='<div>'+k+(k==='Fund'?' (fund / unassigned)':'')+'</div><div>'+fmt(names[k])+'</div>'});
h+='<div class="big">'+((f1||f2)?'Total (date range)':'Total expense')+'</div><div class="big">'+fmt(sumBy(matchD))+'</div>';
document.getElementById("sum").innerHTML=h}
function addC(){contrib.push(["Name",0]);render()}
function today(){var d=new Date(),p=function(n){return (n<10?'0':'')+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function addE(){exp.push(["New item",0,fp||"Fund",today()]);f1=f2="";document.getElementById("f1").value="";document.getElementById("f2").value="";render();var r=document.querySelectorAll("#eb tr");if(r.length){var l=r[r.length-1];l.scrollIntoView({block:"center"});var inp=l.querySelector("input");inp.focus();inp.select()}}
function applyF(t){var i=t.getAttribute("data-i"),f=t.getAttribute("data-f");if(i===null||!exp[i])return null;
if(f==="0")exp[i][0]=t.value;else if(f==="1")exp[i][3]=t.value;else if(f==="2")exp[i][1]=+t.value||0;else if(f==="3"){exp[i][2]=t.value;st("Changed: "+exp[i][0]+" → "+t.value)}return f}
document.getElementById("eb").addEventListener("input",function(ev){if(applyF(ev.target)==="2")sumup()});
document.getElementById("eb").addEventListener("change",function(ev){var f=applyF(ev.target);if(f==="1"||f==="3")render();else if(f==="2")sumup()});
var KEY="pazora-expense-v1";
function st(t){var el=document.getElementById("st");if(el)el.textContent=t}
var tm=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify({contrib:contrib,exp:exp}));st("Saved on this device "+new Date().toLocaleTimeString())}catch(er){st("Could not save on this device")}}
function sched(){clearTimeout(tm);tm=setTimeout(save,400)}
document.addEventListener('change',sched);document.addEventListener('input',sched);
document.addEventListener('click',function(e){if(e.target.tagName==='BUTTON')sched()});
try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.contrib&&s.exp){contrib=s.contrib;exp=s.exp}}catch(er){}
st("Data is saved on this device only");
render();
</script>
</body>
</html>
